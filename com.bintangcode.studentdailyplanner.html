            const max = computed(() => Math.max(...props.history) * 1.01);
            const width = 300;
            const height = 100;

            const viewBox = `0 0 ${width} ${height}`;

                const len = props.history.length;
                const range = max.value - min.value || 1;
                return props.history.map((val, idx) => {
                    const x = (idx / (len - 1 || 1)) * width;
                    const y = height - ((val - min.value) / range) * height;
                    return { x, y };

                if (!dca.cost || !dca.shares || !dca.target) return null;
                const targetPrice = dca.cost * (1 + dca.target / 100);
                const profit = (targetPrice - dca.cost) * dca.shares;
                return { targetPrice: targetPrice.toFixed(2), profit: profit.toFixed(2) };
            });

            // Calendar
            const cal = reactive({ date: '', note: '', list: [] });
            function addMilestone() {
                if (!cal.date || !cal.note) return;
                cal.list.push({ date: cal.date, note: cal.note });
                cal.date = ''; cal.note = '';
                showToast('Milestone added');
            }

            // Loan
            const loan = reactive({ amount: null, rate: null, months: null });
            const loanResult = computed(() => {
                if (!loan.amount || !loan.rate || !loan.months) return null;
                const r = loan.rate / 100 / 12;
                const n = loan.months;
                const p = loan.amount;
                const payment = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                return payment.toFixed(2);
            });

            // Profit
            const prof = reactive({ cost: null, price: null, qty: null });
            const profResult = computed(() => {
                if (!prof.cost || !prof.price || !prof.qty) return null;
                return ((prof.price - prof.cost) * prof.qty).toFixed(2);
            });

            // Reverse Yield
            const rev = reactive({ targetProfit: null, principal: null, years: null });
            const revResult = computed(() => {
                if (!rev.targetProfit || !rev.principal || !rev.years) return null;
                const yieldVal = (Math.pow(1 + rev.targetProfit / rev.principal, 1 / rev.years) - 1) * 100;
                return yieldVal.toFixed(2);
            });

            // Password & MD5
            const pwd = reactive({ input: '' });
            const pwdMd5 = computed(() => pwd.input ? md5(pwd.input) : '');
            const pwdStrengthText = computed(() => {
                if (!pwd.input) return '';
                if (pwd.input.length > 8 && /[A-Z]/.test(pwd.input) && /[0-9]/.test(pwd.input)) return 'Strong';
                if (pwd.input.length >= 6) return 'Moderate';
                return 'Weak';
            });
            const pwdStrengthColor = computed(() => {
                if (pwdStrengthText.value === 'Strong') return 'var(--accent-up)';
                if (pwdStrengthText.value === 'Moderate') return '#f59e0b';
                return 'var(--accent-down)';
            });

            // Credit Memo
            const memo = reactive({ name: '', amount: null, date: '', list: [] });
            function addMemo() {
                if (!memo.name || !memo.amount || !memo.date) return;
                memo.list.push({ name: memo.name, amount: memo.amount, date: memo.date });
                memo.name = ''; memo.amount = null; memo.date = '';
                showToast('Credit memo saved');
            }

            return { dca, dcaResult, cal, addMilestone, loan, loanResult, prof, profResult, rev, revResult, pwd, pwdMd5, pwdStrengthText, pwdStrengthColor, memo, addMemo };
        }

                </router-link>
                <router-link to="/settings" class="tab-item">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    Settings
                </router-link>
            </div>
        `,
        setup() { return {}; }
    };

    // --- Settings Subpages (Privacy, Terms, Team, Version) ---
    const SettingsSubPage = {
        template: `
            <div class="app-header">
                <button @click="$router.back()" class="back-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                    Back
                </button>
                <h1>{{ pageTitle }}</h1>
                <div style="width: 40px;"></div>
            </div>
            <div class="content-body">
                <div class="glass-card">
                    <p style="font-size: 14px; color: var(--text-muted); line-height: 1.6;">{{ contentText }}</p>
                </div>
            </div>
        `,
        setup() {
            const route = VueRouter.useRoute();
            const type = route.query.type || '';
            const pageTitle = computed(() => {
                if (type === 'privacy') return 'Privacy Policy';
                if (type === 'terms') return 'Terms of Service';
                if (type === 'team') return 'About Team';
                return 'Version Info';
            });
            const contentText = computed(() => {
                if (type === 'privacy') return 'We value your privacy. All calculation and market data interactions are processed securely or locally on your device without unauthorized data harvesting.';
                if (type === 'terms') return 'By using 永鈺Delux, you agree to standard financial disclaimer terms. All market information and calculators are provided for analytical reference only.';
                if (type === 'team') return 'Our team consists of dedicated mobile engineers and quantitative finance experts committed to building high-performance offline-first web applications.';
                return '永鈺Delux v2.4.0 is fully optimized for mobile webview containers with zero external server dependencies.';
            });
            return { pageTitle, contentText };
        }
    };

    // --- Monthly Check-in Component ---
    const CheckInPage = {
        template: `
            <div class="app-header">
                <button @click="$router.back()" class="back-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                    Back
                </button>
                <h1>Monthly Check-in</h1>
                <div style="width: 40px;"></div>
            </div>
            <div class="content-body">
                <div class="glass-card" style="text-align: center;">
                    <h3 style="font-size: 16px; margin-bottom: 8px;">October 2026</h3>
                    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Check in daily to maintain your streak.</p>
                    <button @click="doCheckIn" class="btn" :disabled="checkedToday">
                        {{ checkedToday ? 'Checked In Today' : 'Check In Now' }}
                    </button>
                </div>
            </div>
        `,
        setup() {
            const checkedToday = ref(localStorage.getItem('checked_in_date') === new Date().toDateString());
            function doCheckIn() {
                localStorage.setItem('checked_in_date', new Date().toDateString());
                checkedToday.value = true;
                showToast('Check-in successful!');
            }
            return { checkedToday, doCheckIn };
        }
    };

    // --- Feedback Component ---
    const FeedbackPage = {
        template: `
            <div class="app-header">
                <button @click="$router.back()" class="back-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                    Back
                </button>
                <h1>Feedback</h1>
                <div style="width: 40px;"></div>
            </div>
            <div class="content-body">
                <div class="glass-card">
                    <input v-model="form.title" type="text" placeholder="Subject" class="input-field">
                    <textarea v-model="form.content" placeholder="Describe your feedback..." class="input-field" style="height: 120px; resize: none;"></textarea>
                    <button @click="submitFeedback" class="btn" :disabled="!form.title || !form.content">Send Feedback</button>
                </div>
            </div>
        `,
        setup() {
            const router = VueRouter.useRouter();
            const form = reactive({ title: '', content: '' });
            function submitFeedback() {
                if (!form.title || !form.content) return;
                showToast('Feedback sent successfully');
                form.title = ''; form.content = '';
                setTimeout(() => router.back(), 1000);
            }
            return { form, submitFeedback };
        }
    };

    // --- Inbox Component ---
    const InboxPage = {
        template: `
            <div class="app-header">
                <button @click="$router.back()" class="back-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                    Back
                </button>
                <h1>Inbox</h1>
                <div style="width: 40px;"></div>
            </div>
            <div class="content-body">
                <div @click="showAlert" class="glass-card" style="cursor: pointer;">
                    <div style="font-weight: 600; font-size: 14px; margin-bottom: 4px;">Welcome</div>
                    <div style="font-size: 12px; color: var(--text-muted);">Welcome to 永鈺Delux! Explore our offline financial tools and live market tickers.</div>
                </div>
            </div>
        `,
        setup() {
            function showAlert() {
                showToast('Welcome to 永鈺Delux!');
            }
            return { showAlert };
        }
    };

    // --- Router Configuration ---
    const routes = [
        { path: '/', component: LoadingPage },
        { path: '/home', name: 'home', component: HomePage },
        { path: '/sublist', name: 'sublist', component: SubListPage },
        { path: '/detail', name: 'detail', component: StockDetailPage },
        { path: '/toolbox', name: 'toolbox', component: ToolboxPage },
        { path: '/settings', name: 'settings', component: SettingsPage },
        { path: '/subpage', name: 'subpage', component: SettingsSubPage },
        { path: '/checkin', name: 'checkin', component: CheckInPage },
        { path: '/feedback', name: 'feedback', component: FeedbackPage },
        { path: '/inbox', name: 'inbox', component: InboxPage }
    ];

    const router = createRouter({
        history: createWebHashHistory(),
        routes
    });

    const app = createApp({
        setup() {
            return { showToastMsg };
        }
    });

    app.use(router);
    app.mount('#app');
</script>
<div v-if="showToastMsg" class="toast" style="position:fixed; top:20px; left:50%; transform:translateX(-50%); background:rgba(15,23,42,0.95); border:1px solid #6366f1; color:#f8fafc; padding:10px 20px; border-radius:20px; font-size:14px; z-index:2000;">
    {{ showToastMsg }}
</div>
</body>
</html>
